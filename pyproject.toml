[project]
name = "thinkspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivek", email = "vivekkumar@kaybeeexports.com" }
]
requires-python = ">=3.13"
dependencies = [
    "crispy-bootstrap4>=2026.2",
    "django>=6.1",
