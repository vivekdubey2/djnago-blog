    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
thinkspace = "thinkspace:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
