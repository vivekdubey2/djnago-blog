{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<div class="row">

    <!-- Load the sidebar here -->
    {% include "dashboard/sidebar.html" %}

    <!-- Right-side Content -->
    <div class="col-md-9">
        <h1>Edit Category</h1>

        <form action="{% url 'edit_category' category.id %}" method="POST" style="width: 500px;">
            {% csrf_token %}

            {{ form | crispy }}

            <button type="submit" class="btn btn-warning">
                Submit
            </button>
        </form>
        <br>
    </div>

</div>
{% endblock %}
