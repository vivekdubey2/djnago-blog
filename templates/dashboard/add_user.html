{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row">

    <!-- Sidebar -->
    {% include "dashboard/sidebar.html" %}

    <!-- Right-side Content -->
    <div class="col-md-9">

        {% if perms.auth.add_user %}
            <h1>Add New User</h1>

            <form method="POST">
                {% csrf_token %}

                {{ form|crispy }}

                <button type="submit" class="btn btn-warning">
                    Submit
                </button>
            </form>

        {% else %}
            <h5>You don't have access to this page.</h5>
        {% endif %}

    </div>
</div>
{% endblock %}
