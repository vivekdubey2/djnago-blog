<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Lost in Space</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 50% 40%, #18245a 0%, #090d24 35%, #03040d 75%);
    }

    /* Stars */
    .stars,
    .stars::before,
    .stars::after {
      position: absolute;
      inset: 0;
      content: "";
      background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(1px 1px at 30% 80%, #fff, transparent),
        radial-gradient(2px 2px at 70% 30%, #9ed8ff, transparent),
        radial-gradient(1px 1px at 90% 70%, white, transparent),
        radial-gradient(2px 2px at 45% 50%, #fff, transparent),
        radial-gradient(1px 1px at 80% 15%, white, transparent),
        radial-gradient(1px 1px at 20% 60%, #8db8ff, transparent);
      background-size: 300px 300px;
      animation: moveStars 30s linear infinite;
      opacity: 0.7;
    }

    .stars::before {
      transform: scale(1.5);
      animation-duration: 50s;
      opacity: 0.35;
    }

    .stars::after {
      transform: scale(2);
      animation-duration: 80s;
      opacity: 0.2;
    }

    @keyframes moveStars {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-300px);
      }
    }

    .container {
      position: relative;
      z-index: 5;
      width: min(900px, 90%);
      text-align: center;
    }

    /* Planet */
    .planet {
      width: 170px;
      height: 170px;
      margin: 0 auto 35px;
      border-radius: 50%;
      position: relative;

      background:
        radial-gradient(circle at 35% 30%, #ffd7a3, #ff8a65 30%, #c33d68 65%, #451d55);

      box-shadow:
        0 0 30px #ff4d8d,
        0 0 80px rgba(255, 77, 141, 0.35);

      animation: float 4s ease-in-out infinite;
    }

    .planet::before {
      content: "";
      position: absolute;
      width: 250px;
      height: 55px;
      left: -40px;
      top: 58px;
      border: 7px solid rgba(130, 190, 255, 0.7);
      border-radius: 50%;
      transform: rotate(-15deg);
      box-shadow: 0 0 15px #75baff;
    }

    .planet::after {
      content: "•  •";
      position: absolute;
      left: 55px;
      top: 65px;
      font-size: 35px;
      letter-spacing: 15px;
      color: #351936;
      transform: rotate(-15deg);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-18px) rotate(5deg);
      }
    }

    .error {
      font-size: clamp(100px, 20vw, 190px);
      line-height: 0.8;
      font-weight: 900;
      letter-spacing: -12px;
      position: relative;

      background: linear-gradient(
        135deg,
        #ffffff,
        #8fdcff,
        #b36bff,
        #ff65a3
      );

      -webkit-background-clip: text;
      color: transparent;

      filter: drop-shadow(0 0 25px rgba(121, 183, 255, 0.25));
      animation: glitch 3s infinite;
    }

    @keyframes glitch {
      0%, 92%, 100% {
        transform: translate(0);
      }
      93% {
        transform: translate(-5px, 2px);
      }
      94% {
        transform: translate(5px, -2px);
      }
      95% {
        transform: translate(-2px, 0);
      }
    }

    h1 {
      margin-top: 35px;
      font-size: clamp(25px, 5vw, 48px);
      letter-spacing: 2px;
    }

    p {
      max-width: 600px;
      margin: 18px auto 30px;
      color: #aeb8d4;
      line-height: 1.7;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 50px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      background: linear-gradient(90deg, #6c5ce7, #ff4f9a);
      box-shadow: 0 10px 30px rgba(151, 78, 255, 0.3);
      transition: 0.3s ease;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 15px 40px rgba(255, 79, 154, 0.45);
    }

    .signal {
      margin-top: 25px;
      font-size: 12px;
      color: #59627d;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .signal span {
      color: #62ffb0;
      animation: blink 1.2s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0.2;
      }
    }

    /* Shooting star */
    .shooting-star {
      position: absolute;
      width: 100px;
      height: 2px;
      background: linear-gradient(90deg, transparent, white);
      transform: rotate(-35deg);
      top: 20%;
      left: -120px;
      animation: shoot 7s linear infinite;
    }

    @keyframes shoot {
      0% {
        left: -120px;
        top: 15%;
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      25% {
        left: 110%;
        top: 55%;
        opacity: 0;
      }
      100% {
        left: 110%;
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      .planet {
        width: 120px;
        height: 120px;
      }

      .planet::before {
        width: 180px;
        left: -30px;
        top: 40px;
      }

      .planet::after {
        left: 38px;
        top: 45px;
        font-size: 25px;
      }

      .error {
        letter-spacing: -7px;
      }
    }
  </style>
</head>

<body>

  <div class="stars"></div>
  <div class="shooting-star"></div>

  <main class="container">

    <div class="planet"></div>

    <div class="error">404</div>

    <h1>Lost in Space?</h1>

    <p>
      Houston, we have a problem. The page you're looking for
      has drifted somewhere beyond the internet.
      Let's get you safely back to civilization.
    </p>

    <a href="/" class="button">
      🚀 Return Home
    </a>

    <div class="signal">
      <span>●</span> Signal lost — searching for page...
    </div>

  </main>

</body>
</html>
